spring.main.banner-mode=off
spring.session.store-type=jdbc
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.datasource.url=jdbc:postgresql://${postgres.host}:5432/${postgres.db}
spring.datasource.username=${postgres.username}
spring.datasource.password=${postgres.password}
# custom path, not the default with Spring Boot 3
spring.liquibase.change-log=liquibase/liquibase-master.xml

# old strategy for path matching (allows multiple ** as in /xx/**/yyy/**)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.enabled=true
# Tomcat 10.1.42+ counts every multipart field as a "part" (default limit : 50).
# Ride/trip/template forms send ~6 fields per group, so 7 groups was enough to blow the limit.
server.tomcat.max-part-count=1000

server.servlet.session.timeout=86400s
server.servlet.session.cookie.max-age=86400s

# optional facebook connect
spring.security.oauth2.client.registration.facebook.client-id=${facebook.client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${facebook.client-secret}
spring.security.oauth2.client.registration.facebook.redirect-uri=${site.url}/login/oauth2/code/facebook

# optional sign in with google
spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${site.url}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email

# strava connect
spring.security.oauth2.client.registration.strava.client-id=${strava.client-id}
spring.security.oauth2.client.registration.strava.client-secret=${strava.client-secret}
spring.security.oauth2.client.registration.strava.redirect-uri=${site.url}/login/oauth2/code/strava
spring.security.oauth2.client.registration.strava.client-name=strava
spring.security.oauth2.client.registration.strava.scope=read
spring.security.oauth2.client.registration.strava.token-uri=${strava.base-url:https://www.strava.com}/oauth/token
spring.security.oauth2.client.registration.strava.authorization-uri=${strava.base-url:https://www.strava.com}/oauth/mobile/authorize
spring.security.oauth2.client.registration.strava.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.strava.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.strava.token-uri=${strava.base-url:https://www.strava.com}/oauth/token
spring.security.oauth2.client.provider.strava.authorization-uri=${strava.base-url:https://www.strava.com}/oauth/mobile/authorize?approval_prompt=auto
spring.security.oauth2.client.provider.strava.user-info-uri=${strava.base-url:https://www.strava.com}/api/v3/athlete
spring.security.oauth2.client.provider.strava.user-info-authentication-method=header
spring.security.oauth2.client.provider.strava.user-name-attribute=id
spring.security.oauth2.client.provider.strava.client-authentication-method=client_secret_post

# this is the user that will be created at startup with admin permissions
admin.first-name=Admin
admin.last-name=Admin

spring.mail.host=${smtp.host}
spring.mail.port=${smtp.port}
spring.mail.protocol=${smtp.protocol}
spring.mail.username=${smtp.username}
spring.mail.password=${smtp.password}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtps.starttls.enable=true
spring.mail.properties.mail.smtps.ssl.trust=${smtp.host}
spring.mail.properties.mail.smtps.timeout=8000

rabbitmq.autostartup=true

logging.level.org.springframework.boot=ERROR
logging.level.org.springframework.context.support=ERROR
logging.level.org.apache=ERROR
logging.level.hsqldb.db=ERROR
logging.level.io.github.glandais=INFO
logging.level.info.tomacla.biketeam=INFO
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg %n
logging.pattern.file=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg %n
logging.file.max-size=10MB
logging.file.max-history=10

management.endpoint.logfile.enabled=true
management.endpoints.enabled-by-default=false
management.endpoints.web.base-path=/management
management.endpoints.web.exposure.include=*
management.security.enabled=false
management.security.roles=ROLE_ADMIN

rememberme.validity=2592000

# --- authentification email / mot de passe ---
auth.email-verification.validity-hours=24
auth.password-reset.validity-hours=1
# OFF : aucune sollicitation | SUGGESTED : bandeau + badge | ENFORCED : bandeau + redirection forcee
auth.completion.mode=SUGGESTED
auth.rotate-legacy-seed=true
auth.login.max-attempts=10
auth.login.lock-minutes=15
auth.forgot-password.max-per-hour=3
auth.register.max-per-hour=5

# --- authentification par passkey (WebAuthn) ---
# Les deux premieres proprietes sont surchargeables par AUTH_PASSKEY_RP_ID et
# AUTH_PASSKEY_ORIGINS (voir .env.template). Vides, elles sont derivees de site.url,
# ce qui convient a tout deploiement mono-domaine.
#
# Le RP ID est le domaine auquel la passkey est liee : l'authentificateur refuse de la
# presenter ailleurs. Ne le forcer que pour couvrir plusieurs sous-domaines, et toujours
# avec un suffixe enregistrable de l'origine, sinon le navigateur refuse l'enregistrement
# sans message d'erreur.
auth.passkey.rp-id=
# Origines supplementaires acceptees, separees par des virgules (reverse proxy expose sur
# plusieurs noms). L'origine derivee de site.url est toujours acceptee.
auth.passkey.origins=
# Duree de validite d'un challenge, qui sert aussi de timeout cote navigateur.
auth.passkey.challenge-validity-seconds=300
auth.passkey.max-per-user=20
# Debit maximal par heure et par adresse IP sur POST /login/webauthn/options : cette route
# est publique et cree une session, elle serait sinon un generateur gratuit de sessions.
auth.passkey.login-options.max-per-hour=60

# amorcage d'un administrateur sans Strava (optionnel, prepare le retrait de Strava) :
# ADMIN_EMAIL et ADMIN_PASSWORD sont lus directement de l'environnement par la liaison relachee
# de Spring Boot (comme ADMIN_STRAVA_ID). Ne JAMAIS les declarer ici sous la forme
# admin.email=<placeholder admin.email> : le placeholder porterait le nom de la propriete qu'il
# definit, ce que Spring rejette en reference circulaire des que la variable est absente
# (PlaceholderResolutionException au demarrage).
